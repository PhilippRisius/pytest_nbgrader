[tox]
min_version = 4.52.0
envlist =
    lint
    py{3.10,3.11,3.12,3.13,3.14}
    docs
requires =
    flit >= 3.11.0,<4.0
    pip >= 26.0.1
    ; tox provisions itself when the host pip is older; keep the [gh] mapping working there
    tox-gh >= 1.7.1
opts =
    --verbose

[gh]
python =
    3.10 = py3.10-coverage
    3.11 = py3.11-coverage
    3.12 = py3.12-coverage
    3.13 = py3.13
    3.14 = py3.14

[testenv:lint]
skip_install = True
; Pin linters to the revisions in .pre-commit-config.yaml. ruff runs with
; `preview = true`, so an unpinned ruff can start failing on new preview rules.
deps =
    ruff ==0.15.9
    numpydoc ==1.10.0
commands =
    make lint
allowlist_externals =
    make

[testenv:docs]
extras =
    docs
commands =
    make autodoc
    make --directory=docs clean html
allowlist_externals =
    make

[testenv]
setenv =
    PYTEST_ADDOPTS = "--color=yes"
    PYTHONPATH = {toxinidir}
passenv =
    COVERALLS_*
    GITHUB_*
extras =
    dev
download = True
install_command = python -m pip install --no-user {opts} {packages}
deps =
    coverage: coveralls>=4.0.1
commands_pre =
    pip list
    pip check
commands =
    pytest --cov
    ; Coveralls authenticates via COVERALLS_REPO_TOKEN env var (passed from CI)
    coverage: coveralls
